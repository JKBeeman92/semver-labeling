name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-dist:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit dist/ to the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dist; then
            git add dist
            git commit -m "chore: build dist for ${{ needs.release-please.outputs.tag_name }}"
            git tag -f "${{ needs.release-please.outputs.tag_name }}"
            git push origin HEAD:main
            git push origin "${{ needs.release-please.outputs.tag_name }}" --force
          fi

      - name: Move floating major version tag (e.g. v2)
        run: |
          major="v${{ needs.release-please.outputs.major }}"
          git tag -f "$major"
          git push origin "$major" --force
